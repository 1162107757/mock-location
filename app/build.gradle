plugins {
    id "com.android.application"
}

android {
    namespace "dev.drift.location"
    compileSdk 36
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "dev.drift.location"
        minSdk 25
        targetSdk 36
        versionCode 20
        versionName "0.12.3-webmap-raster"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            merges += ["META-INF/xposed/*"]
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    compileOnly project(":xposed-stubs")
}
