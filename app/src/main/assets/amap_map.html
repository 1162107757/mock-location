<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { background: #0f172a; }
        #map-status {
            position: absolute;
            left: 50%;
            top: 42%;
            z-index: 2147483647;
            max-width: 78%;
            transform: translate(-50%, -50%);
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.90);
            color: #f8fafc;
            font: 14px/1.5 sans-serif;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.24);
        }
        #map-status[hidden] { display: none; }
        #map-retry {
            display: none;
            margin: 10px auto 0;
            padding: 7px 16px;
            border: 0;
            border-radius: 8px;
            background: #22c55e;
            color: #0f172a;
            font-weight: bold;
        }
        #draw-tip {
            position: absolute;
            left: 50%;
            bottom: 22%;
            z-index: 2147483646;
            max-width: 76%;
            transform: translateX(-50%);
            padding: 9px 14px;
            border-radius: 10px;
            background: rgba(7, 7, 6, 0.84);
            color: #fffdf5;
            font: 13px/1.45 sans-serif;
            text-align: center;
            pointer-events: none;
        }
        #draw-tip[hidden] { display: none; }
        #draw-cursor {
            position: absolute;
            z-index: 2147483645;
            width: 26px;
            height: 26px;
            margin: -16px 0 0 -16px;
            border: 3px solid #2f98e8;
            border-radius: 50%;
            background: rgba(255, 253, 245, 0.92);
            box-shadow: 0 1px 7px rgba(0, 0, 0, 0.42);
            pointer-events: none;
        }
        #draw-cursor::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 8px;
            height: 8px;
            margin: -4px 0 0 -4px;
            border-radius: 50%;
            background: #e84a26;
        }
        #draw-cursor-stem {
            position: absolute;
            z-index: 2147483644;
            height: 2px;
            transform-origin: 0 50%;
            background: rgba(47, 152, 232, 0.8);
            pointer-events: none;
        }
        #draw-cursor.pick-mode {
            border-color: #faaf14;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.42), 0 0 0 5px rgba(250, 175, 20, 0.18);
        }
        #draw-cursor-badge {
            position: absolute;
            z-index: 2147483646;
            transform: translate(-50%, -100%);
            margin-top: -15px;
            padding: 4px 8px;
            border-radius: 9px;
            background: #faaf14;
            color: #070706;
            font: 12px/1.2 sans-serif;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
        }
        #draw-cursor[hidden], #draw-cursor-stem[hidden], #draw-cursor-badge[hidden] { display: none; }
    </style>
    <script>
        window._AMapSecurityConfig = { securityJsCode: '__AMAP_SECURITY_CODE__' };
        window.__DRIFT_LEGACY_AMAP__ = __AMAP_LEGACY__;
        if (window.__DRIFT_LEGACY_AMAP__) window.forbidenWebGL = true;
    </script>
    <script src="https://webapi.amap.com/maps?v=__AMAP_VERSION__&key=__AMAP_KEY__&plugin=AMap.PlaceSearch"></script>
</head>
<body>
<div id="map"></div>
<div id="map-status">
    <span id="map-status-text">地图加载中…</span>
    <button id="map-retry" type="button" onclick="window.location.reload()">重新加载</button>
</div>
<div id="draw-tip" hidden></div>
<div id="draw-cursor-stem" hidden></div>
<div id="draw-cursor" hidden></div>
<div id="draw-cursor-badge" hidden>起点预览</div>
<script>
    (function () {
        var map = null;
        var placeSearch = null;
        var routePolyline = null;
        var routeMarkers = [];
        var routeMarkersVisible = true;
        var drawingEnabled = false;
        var drawingPicking = false;
        var drawingActive = false;
        var drawingPath = [];
        var drawingLastPixel = null;
        var drawingPreview = null;
        var drawingTouching = false;
        var drawingTouchLast = null;
        var drawingPanPendingX = 0;
        var drawingPanPendingY = 0;
        var drawingPanFrame = null;
        var drawingFinishTimer = null;
        var drawingCursor = null;
        var drawingCursorStem = null;
        var drawingCursorBadge = null;
        var drawingCursorAnchor = null;
        var drawingTouchOffset = null;
        var applyingCenter = false;
        var readyReported = false;

        function showStatus(message, canRetry) {
            var status = document.getElementById('map-status');
            var text = document.getElementById('map-status-text');
            var retry = document.getElementById('map-retry');
            if (!status || !text || !retry) return;
            text.textContent = message;
            retry.style.display = canRetry ? 'block' : 'none';
            status.hidden = false;
        }

        function hideStatus() {
            var status = document.getElementById('map-status');
            if (status) status.hidden = true;
        }

        function showDrawTip(message) {
            var tip = document.getElementById('draw-tip');
            if (!tip) return;
            tip.textContent = message || '';
            tip.hidden = !message;
        }

        function hideDrawingCursor() {
            if (drawingCursor) drawingCursor.hidden = true;
            if (drawingCursorStem) drawingCursorStem.hidden = true;
            if (drawingCursorBadge) drawingCursorBadge.hidden = true;
            drawingCursorAnchor = null;
            drawingTouchOffset = null;
            drawingTouching = false;
            drawingTouchLast = null;
            drawingPanPendingX = 0;
            drawingPanPendingY = 0;
            if (drawingPanFrame != null) {
                if (window.cancelAnimationFrame) window.cancelAnimationFrame(drawingPanFrame);
                else window.clearTimeout(drawingPanFrame);
                drawingPanFrame = null;
            }
            if (drawingFinishTimer) {
                window.clearTimeout(drawingFinishTimer);
                drawingFinishTimer = null;
            }
        }

        function drawingTouchPosition(event) {
            var touch = event && event.touches && event.touches.length
                ? event.touches[0] : event;
            var container = document.getElementById('map');
            if (!touch || !container) return null;
            var rect = container.getBoundingClientRect();
            var touchX = Number(touch.clientX) - rect.left;
            var touchY = Number(touch.clientY) - rect.top;
            if (!isFinite(touchX) || !isFinite(touchY)
                    || rect.width <= 0 || rect.height <= 0) return null;
            var offsetX = drawingTouchOffset ? drawingTouchOffset.x : 0;
            var offsetY = drawingTouchOffset ? drawingTouchOffset.y : 58;
            var cursorX = touchX - offsetX;
            var cursorY = touchY - offsetY;
            if (!drawingTouchOffset) {
                if (cursorY < 32) cursorY = touchY + offsetY;
                // Keep the target below the native title bar when the finger is near the top.
                var topSafe = Math.min(88, rect.height * 0.12);
                if (cursorY < topSafe && touchY > topSafe) cursorY = touchY + offsetY;
            }
            cursorX = Math.max(18, Math.min(rect.width - 18, cursorX));
            cursorY = Math.max(18, Math.min(rect.height - 18, cursorY));
            return {
                touchX: touchX,
                touchY: touchY,
                cursorX: cursorX,
                cursorY: cursorY,
                rect: rect
            };
        }

        function updateDrawingCursor(position) {
            if (!position) return;
            if (!drawingCursor) drawingCursor = document.getElementById('draw-cursor');
            if (!drawingCursorStem) drawingCursorStem = document.getElementById('draw-cursor-stem');
            if (!drawingCursorBadge) drawingCursorBadge = document.getElementById('draw-cursor-badge');
            if (!drawingCursor || !drawingCursorStem) return;
            drawingCursor.style.left = position.cursorX + 'px';
            drawingCursor.style.top = position.cursorY + 'px';
            if (drawingCursorBadge) {
                drawingCursorBadge.style.left = position.cursorX + 'px';
                drawingCursorBadge.style.top = position.cursorY + 'px';
            }
            var dx = position.cursorX - position.touchX;
            var dy = position.cursorY - position.touchY;
            var distance = Math.sqrt(dx * dx + dy * dy);
            drawingCursorStem.style.left = position.touchX + 'px';
            drawingCursorStem.style.top = position.touchY + 'px';
            drawingCursorStem.style.width = Math.max(0, distance - 13) + 'px';
            drawingCursorStem.style.transform = 'rotate(' + Math.atan2(dy, dx) + 'rad)';
            drawingCursor.hidden = false;
            drawingCursorStem.hidden = false;
        }

        function primeDrawingCursor() {
            var container = document.getElementById('map');
            if (!container) return;
            var rect = container.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;
            if (!drawingCursor) drawingCursor = document.getElementById('draw-cursor');
            if (!drawingCursorStem) drawingCursorStem = document.getElementById('draw-cursor-stem');
            if (!drawingCursorBadge) drawingCursorBadge = document.getElementById('draw-cursor-badge');
            if (!drawingCursor || !drawingCursorStem) return;
            var anchorX = rect.width / 2;
            // Keep the origin in the visible map area above the native route panel.
            var safeAnchorY = rect.height * 0.42;
            var anchorY = safeAnchorY;
            drawingCursorAnchor = { x: anchorX, y: anchorY };
            drawingCursor.style.left = anchorX + 'px';
            drawingCursor.style.top = anchorY + 'px';
            drawingCursor.classList.toggle('pick-mode', !!drawingPicking);
            drawingCursor.hidden = false;
            drawingCursorStem.hidden = true;
            if (drawingCursorBadge) {
                drawingCursorBadge.style.left = anchorX + 'px';
                drawingCursorBadge.style.top = anchorY + 'px';
                drawingCursorBadge.textContent = drawingPicking ? '起点预览' : '实际起点';
                drawingCursorBadge.hidden = false;
            }
        }

        function updateCoverageStatus(latitude, longitude) {
            var mainlandBounds = latitude >= 18 && latitude <= 54 && longitude >= 73 && longitude <= 135;
            if (mainlandBounds) {
                hideStatus();
            } else {
                showStatus('当前坐标位于中国大陆以外；若底图为空，需要为高德 Key 开通世界地图权限', false);
            }
        }

        function reportReady() {
            if (readyReported) return;
            readyReported = true;
            hideStatus();
            var ready = bridge('onMapReady');
            if (ready) ready.onMapReady();
        }

        function bridge(name) {
            return window.DriftBridge && typeof window.DriftBridge[name] === 'function'
                ? window.DriftBridge : null;
        }

        function emitCenter() {
            if (applyingCenter || !map) return;
            var center = map.getCenter();
            var target = bridge('onCenterChanged');
            if (center && target) target.onCenterChanged(center.lat, center.lng);
        }

        window.setCenter = function (latitude, longitude, zoom) {
            if (!map) return;
            applyingCenter = true;
            map.setCenter([longitude, latitude], false, 200);
            if (typeof zoom === 'number') map.setZoom(zoom, false, 200);
            updateCoverageStatus(latitude, longitude);
            window.setTimeout(function () { applyingCenter = false; }, 350);
        };

        window.setZoom = function (value) {
            if (map) map.setZoom(Number(value));
        };

        window.zoomIn = function () {
            if (map) map.zoomIn();
        };

        window.zoomOut = function () {
            if (map) map.zoomOut();
        };

        window.fitRoute = function () {
            if (!map) return;
            var overlays = [];
            if (routePolyline) overlays.push(routePolyline);
            for (var index = 0; index < routeMarkers.length; index++) {
                overlays.push(routeMarkers[index]);
            }
            if (overlays.length > 1 && typeof map.setFitView === 'function') {
                map.setFitView(overlays, false, [64, 64, 360, 64], 18);
            } else if (routeMarkers.length === 1 && routeMarkers[0]) {
                var position = routeMarkers[0].getPosition();
                if (position) map.setCenter(position, false, 260);
            }
        };

        window.resumeMap = function () {
            if (map && typeof map.resize === 'function') map.resize();
        };

        window.clearRoute = function () {
            if (!map) return;
            if (routePolyline) {
                map.remove(routePolyline);
                routePolyline = null;
            }
            if (routeMarkers.length) {
                map.remove(routeMarkers);
                routeMarkers = [];
            }
        };

        window.setRouteMarkersVisible = function (visible) {
            routeMarkersVisible = !!visible;
            for (var index = 0; index < routeMarkers.length; index++) {
                if (routeMarkers[index] && typeof routeMarkers[index].setMap === 'function') {
                    routeMarkers[index].setMap(routeMarkersVisible ? map : null);
                }
            }
        };

        window.setDrawingEnabled = function (enabled) {
            drawingEnabled = !!enabled;
            drawingPicking = false;
            drawingActive = false;
            drawingPath = [];
            drawingLastPixel = null;
            if (drawingPreview && map) {
                map.remove(drawingPreview);
                drawingPreview = null;
            }
            showDrawTip('');
            hideDrawingCursor();
            if (map && typeof map.setStatus === 'function') {
                map.setStatus({
                    // We pan the map in the inverse direction ourselves so the
                    // route follows the user's finger under the fixed cursor.
                    dragEnable: false,
                    zoomEnable: false,
                    doubleClickZoom: false
                });
            }
            var container = document.getElementById('map');
            if (container) container.style.touchAction = drawingEnabled ? 'none' : 'auto';
            if (drawingEnabled) primeDrawingCursor();
        };

        window.setDrawingPicking = function (enabled) {
            drawingPicking = !!enabled;
            if (!drawingPicking && drawingEnabled) {
                // The map is already in center-lock drawing mode. Do not let a
                // late initialization callback hide the active cursor.
                if (drawingCursor) drawingCursor.classList.remove('pick-mode');
                if (drawingCursorBadge) {
                    drawingCursorBadge.textContent = '实际起点';
                    drawingCursorBadge.hidden = false;
                }
                if (map && typeof map.setStatus === 'function') {
                    map.setStatus({
                        dragEnable: true,
                        zoomEnable: true,
                        doubleClickZoom: false
                    });
                }
                return;
            }
            drawingEnabled = false;
            drawingActive = false;
            drawingPath = [];
            drawingLastPixel = null;
            if (drawingPreview && map) {
                map.remove(drawingPreview);
                drawingPreview = null;
            }
            showDrawTip('');
            hideDrawingCursor();
            if (map && typeof map.setStatus === 'function') {
                map.setStatus({
                    dragEnable: true,
                    zoomEnable: true,
                    doubleClickZoom: true
                });
            }
            var container = document.getElementById('map');
            if (container) container.style.touchAction = 'auto';
            if (drawingPicking) primeDrawingCursor();
        };

        function drawingPointFromPixel(pixelX, pixelY) {
            if (!map || !isFinite(pixelX) || !isFinite(pixelY)
                    || typeof map.containerToLngLat !== 'function') return null;
            var lngLat = map.containerToLngLat(new AMap.Pixel(pixelX, pixelY));
            if (!lngLat || !isFinite(lngLat.lat) || !isFinite(lngLat.lng)) return null;
            return { pixelX: pixelX, pixelY: pixelY, latitude: lngLat.lat, longitude: lngLat.lng };
        }

        function drawingPointFromTouch(event) {
            var position = drawingTouchPosition(event);
            updateDrawingCursor(position);
            if (!position) return null;
            return drawingPointFromPixel(position.cursorX, position.cursorY);
        }

        function appendDrawingCenterPoint() {
            if (!drawingCursorAnchor) return;
            appendDrawingPixel(drawingCursorAnchor.x, drawingCursorAnchor.y, true);
        }

        function beginCenterDrawing() {
            if (!drawingEnabled || drawingActive) return;
            if (drawingFinishTimer) {
                window.clearTimeout(drawingFinishTimer);
                drawingFinishTimer = null;
            }
            drawingTouching = true;
            drawingTouchLast = null;
            drawingActive = true;
            drawingPath = [];
            drawingLastPixel = null;
            appendDrawingCenterPoint();
        }

        function flushDrawingPan() {
            drawingPanFrame = null;
            if (!drawingEnabled || !drawingActive || !map) {
                drawingPanPendingX = 0;
                drawingPanPendingY = 0;
                return;
            }
            var dx = drawingPanPendingX;
            var dy = drawingPanPendingY;
            drawingPanPendingX = 0;
            drawingPanPendingY = 0;
            if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
                // AMap's panBy moves the rendered map in the supplied direction;
                // invert it so the coordinate under the fixed cursor follows the finger.
                map.panBy(-dx, -dy, 0);
            }
            if (Math.abs(drawingPanPendingX) > 0 || Math.abs(drawingPanPendingY) > 0) {
                scheduleDrawingPan();
            }
        }

        function scheduleDrawingPan() {
            if (drawingPanFrame != null) return;
            if (window.requestAnimationFrame) {
                drawingPanFrame = window.requestAnimationFrame(flushDrawingPan);
            } else {
                drawingPanFrame = window.setTimeout(flushDrawingPan, 16);
            }
        }

        function queueDrawingPan(dx, dy) {
            drawingPanPendingX += dx;
            drawingPanPendingY += dy;
            scheduleDrawingPan();
        }

        function appendDrawingPixel(pixelX, pixelY, centerSample) {
            var point = drawingPointFromPixel(pixelX, pixelY);
            if (!point) return;
            if (centerSample && drawingPath.length) {
                var previous = drawingPath[drawingPath.length - 1];
                if (previous && Math.abs(point.latitude - previous.latitude) < 1e-7
                        && Math.abs(point.longitude - previous.longitude) < 1e-7) return;
            } else if (drawingLastPixel) {
                var dx = point.pixelX - drawingLastPixel.x;
                var dy = point.pixelY - drawingLastPixel.y;
                if (Math.sqrt(dx * dx + dy * dy) < 6) return;
            }
            drawingLastPixel = { x: point.pixelX, y: point.pixelY };
            drawingPath.push({ latitude: point.latitude, longitude: point.longitude });
            if (!drawingPreview) {
                drawingPreview = new AMap.Polyline({
                    path: [],
                    strokeColor: '#38bdf8',
                    strokeWeight: 5,
                    strokeOpacity: 0.95,
                    lineJoin: 'round'
                });
                map.add(drawingPreview);
            }
            var path = [];
            for (var index = 0; index < drawingPath.length; index++) {
                path.push([drawingPath[index].longitude, drawingPath[index].latitude]);
            }
            drawingPreview.setPath(path);
        }

        function appendDrawingPoint(event) {
            var point = drawingPointFromTouch(event);
            if (point) appendDrawingPixel(point.pixelX, point.pixelY);
        }

        function updateEdgeHint(event) {
            if (!drawingEnabled || !drawingActive || !event) return;
            var touch = event.touches && event.touches.length ? event.touches[0] : event;
            var container = document.getElementById('map');
            if (!touch || !container) return;
            var rect = container.getBoundingClientRect();
            var x = Number(touch.clientX) - rect.left;
            var y = Number(touch.clientY) - rect.top;
            var edge = 34;
            if (x <= edge || y <= edge || x >= rect.width - edge || y >= rect.height - edge) {
                showDrawTip('已到地图边缘，请松手后移动地图，再点击“自绘”继续');
            } else {
                showDrawTip('');
            }
        }

        function finishDrawing() {
            if (!drawingActive) return;
            drawingTouching = false;
            if (drawingFinishTimer) {
                window.clearTimeout(drawingFinishTimer);
                drawingFinishTimer = null;
            }
            drawingActive = false;
            drawingTouchLast = null;
            drawingPanPendingX = 0;
            drawingPanPendingY = 0;
            if (drawingPanFrame != null) {
                if (window.cancelAnimationFrame) window.cancelAnimationFrame(drawingPanFrame);
                else window.clearTimeout(drawingPanFrame);
                drawingPanFrame = null;
            }
            if (drawingPreview && map) {
                map.remove(drawingPreview);
                drawingPreview = null;
            }
            if (drawingPath.length >= 2) {
                var target = bridge('onDrawPath');
                if (target) target.onDrawPath(JSON.stringify(drawingPath));
            }
            showDrawTip('');
            drawingPath = [];
            drawingLastPixel = null;
            // Keep the fixed cursor and drawing mode active so the next drag
            // starts a new segment from this segment's endpoint.
            if (drawingCursorBadge) {
                drawingCursorBadge.textContent = '继续绘制';
                drawingCursorBadge.hidden = false;
            }
        }

        var mapElement = document.getElementById('map');
        if (mapElement) {
            mapElement.addEventListener('touchstart', function (event) {
                if (!drawingEnabled) return;
                event.preventDefault();
                beginCenterDrawing();
                var position = drawingTouchPosition(event);
                if (position) drawingTouchLast = { x: position.touchX, y: position.touchY };
            }, false);
            mapElement.addEventListener('touchmove', function (event) {
                if (!drawingEnabled || !drawingActive) return;
                event.preventDefault();
                var position = drawingTouchPosition(event);
                if (!position) return;
                if (!drawingTouchLast) {
                    drawingTouchLast = { x: position.touchX, y: position.touchY };
                    return;
                }
                var dx = position.touchX - drawingTouchLast.x;
                var dy = position.touchY - drawingTouchLast.y;
                drawingTouchLast = { x: position.touchX, y: position.touchY };
                if (map && (Math.abs(dx) > 0 || Math.abs(dy) > 0)) {
                    queueDrawingPan(dx, dy);
                }
            }, false);
            mapElement.addEventListener('touchend', function (event) {
                if (!drawingEnabled) return;
                event.preventDefault();
                drawingTouching = false;
                drawingTouchLast = null;
                // Give the final mapmove/dragend event a chance to append the last point.
                if (drawingFinishTimer) window.clearTimeout(drawingFinishTimer);
                drawingFinishTimer = window.setTimeout(finishDrawing, 180);
            }, false);
            mapElement.addEventListener('touchcancel', function (event) {
                if (!drawingEnabled) return;
                event.preventDefault();
                drawingTouchLast = null;
                finishDrawing();
            }, false);
        }

        window.setRoute = function (json) {
            if (!map) return;
            window.clearRoute();
            var values;
            try {
                values = typeof json === 'string' ? JSON.parse(json) : json;
            } catch (ignored) {
                values = [];
            }
            if (!values || values.length < 1) return;
            var path = [];
            for (var index = 0; index < values.length; index++) {
                var point = values[index];
                if (!point || !isFinite(Number(point.latitude)) || !isFinite(Number(point.longitude))) continue;
                path.push([Number(point.longitude), Number(point.latitude)]);
            }
            if (path.length < 1) return;
            var startMarker = new AMap.Marker({
                position: path[0],
                title: '起点',
                content: markerContent('#22c55e'),
                anchor: 'center',
                offset: new AMap.Pixel(0, 0)
            });
            routeMarkers = [startMarker];
            if (path.length >= 2) {
                routePolyline = new AMap.Polyline({
                    path: path,
                    strokeColor: '#22c55e',
                    strokeWeight: 5,
                    strokeOpacity: 0.92,
                    showDir: true,
                    lineJoin: 'round'
                });
                map.add(routePolyline);
                var endMarker = new AMap.Marker({
                    position: path[path.length - 1],
                    title: '终点',
                    content: markerContent('#ef4444'),
                    anchor: 'center',
                    offset: new AMap.Pixel(0, 0)
                });
                routeMarkers.push(endMarker);
            }
            map.add(routeMarkers);
            if (!routeMarkersVisible) window.setRouteMarkersVisible(false);
        };

        function markerContent(color) {
            return '<div style="width:14px;height:14px;border-radius:50%;background:' + color
                + ';border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>';
        }

        window.searchLocation = function (keyword) {
            if (!map || !window.AMap) {
                var unavailable = bridge('onSearchError');
                if (unavailable) unavailable.onSearchError('地图尚未加载完成');
                return;
            }
            if (!placeSearch) placeSearch = new AMap.PlaceSearch({ pageSize: 10, pageIndex: 1 });
            placeSearch.search(keyword, function (status, result) {
                var callback;
                if (status === 'complete' && result && result.poiList) {
                    var pois = result.poiList.pois || [];
                    var values = [];
                    for (var index = 0; index < pois.length; index++) {
                        var poi = pois[index];
                        if (!poi.location) continue;
                        values.push({
                            name: displayName(poi, keyword),
                            latitude: poi.location.lat,
                            longitude: poi.location.lng
                        });
                    }
                    callback = bridge('onSearchResults');
                    if (callback) callback.onSearchResults(JSON.stringify(values));
                    return;
                }
                callback = bridge('onSearchError');
                if (callback) callback.onSearchError(status || '高德搜索失败');
            });
        };

        function displayName(poi, fallback) {
            var parts = [poi.name, poi.address, poi.cityname, poi.adname];
            var output = [];
            for (var index = 0; index < parts.length; index++) {
                var value = parts[index] == null ? '' : String(parts[index]).trim();
                if (!value || output.indexOf(value) >= 0) continue;
                output.push(value);
            }
            return output.length ? output.join(' · ') : fallback;
        }

        function init() {
            try {
                if (!window.AMap) {
                    var unavailable = bridge('onMapError');
                    if (unavailable) unavailable.onMapError('高德 JS API 加载失败，请检查 Web端(JS API) Key、安全密钥和网络');
                    return;
                }
                var mapOptions = {
                    resizeEnable: true,
                    zoom: 13,
                    center: [121.473701, 31.230416],
                    viewMode: '2D',
                    rotateEnable: false,
                    pitchEnable: false,
                    dragEnable: true,
                    zoomEnable: true,
                    doubleClickZoom: true,
                    zooms: [2, 20]
                };
                if (window.__DRIFT_LEGACY_AMAP__) {
                    mapOptions.baseRender = 'd';
                    mapOptions.showIndoorMap = false;
                }
                map = new AMap.Map('map', mapOptions);
                map.on('dragstart', beginCenterDrawing);
                map.on('dragging', function () {
                    if (drawingEnabled && drawingActive) appendDrawingCenterPoint();
                });
                map.on('dragend', finishDrawing);
                map.on('moveend', function () {
                    emitCenter();
                    if (drawingEnabled && drawingActive) appendDrawingCenterPoint();
                });
                map.on('mapmove', function () {
                    if (drawingEnabled && drawingActive) appendDrawingCenterPoint();
                });
                map.on('click', function (event) {
                    if (drawingEnabled || drawingPicking) return;
                    if (!event || !event.lnglat) return;
                    var target = bridge('onMapTapped');
                    if (target) target.onMapTapped(event.lnglat.lat, event.lnglat.lng);
                });
                map.on('complete', reportReady);
                map.on('tilesloaded', reportReady);
                window.setDrawingEnabled(drawingEnabled);
                window.setDrawingPicking(drawingPicking);
            } catch (exception) {
                showStatus('高德地图初始化失败', true);
                var error = bridge('onMapError');
                if (error) error.onMapError(String(exception && exception.message || '高德地图初始化失败'));
            }
        }

        function initWhenSized(attempt) {
            if (map) return;
            var container = document.getElementById('map');
            if (container && container.clientWidth > 0 && container.clientHeight > 0) {
                init();
                return;
            }
            if (attempt < 40) {
                window.setTimeout(function () { initWhenSized(attempt + 1); }, 50);
                return;
            }
            showStatus('地图容器初始化失败，请点击重新加载', true);
            var error = bridge('onMapError');
            if (error) error.onMapError('地图容器尺寸异常');
        }

        if (window.AMap) initWhenSized(0);
        else window.addEventListener('load', function () { initWhenSized(0); });
        window.onerror = function (message) {
            if (!window.AMap) {
                showStatus('高德 JS API 加载失败，请检查网络和地图配置', true);
                var error = bridge('onMapError');
                if (error) error.onMapError(String(message || '高德 JS API 加载失败'));
            }
        };
    })();
</script>
</body>
</html>
